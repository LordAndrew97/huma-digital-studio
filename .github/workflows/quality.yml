name: Site quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --check assets/site.js
      - run: node --check assets/demo-image-selector.js
      - run: node --check assets/demo-generator.js
      - run: node --check functions/api/leads.js
      - run: node scripts/test-demo-images.cjs
      - run: node scripts/validate-site.mjs
