<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>html,body{margin:0;padding:0;width:1280px;height:900px;background:#000;overflow:hidden}</style>
<script>
window.onload = function(){
  // Trigger the restaurante demo after page loads
  setTimeout(function(){
    var cards = document.querySelectorAll('.open-demo');
    cards.forEach(function(c){ if(c.getAttribute('data-demo')==='restaurante'){ c.click(); } });
  }, 2000);
};
</script>
</head><body>
<iframe src="http://localhost:9000/" id="f" width="1280" height="900" style="border:none"></iframe>
</body></html>
